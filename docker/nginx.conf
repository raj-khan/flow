server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The landing is a static page, not an app route.
  location = / {
    try_files /landing.html =404;
  }

  # Client-side routes have no file on disk; without this a refresh returns 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Not cached, or a deploy stays invisible until browsers drop their copy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
