<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convert · isketch</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --canvas: #f4f5f8;
        --surface: #ffffff;
        --ink: #14181f;
        --muted: #64748b;
        --line: #e3e7ee;
        --brand-ink: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0d1117;
          --surface: #161b22;
          --ink: #e6edf3;
          --muted: #94a3b8;
          --line: #21262d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.55;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 16px;
        font-size: 14px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
        resize: vertical;
      }
      textarea:focus {
        outline: 2px solid var(--brand-ink);
        outline-offset: -1px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .btn {
        background: var(--brand-ink);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 9px 18px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .error {
        margin: 12px 0 0;
        padding: 10px 14px;
        border-radius: 8px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 13.5px;
        white-space: pre-wrap;
      }
      .preview {
        margin-top: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        overflow: auto;
        max-height: 380px;
      }
      .preview svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .hidden {
        display: none;
      }
    </style>
    <script src="/analytics.js" defer></script>
  </head>
  <body>
    <main>
      <h1 id="title">Convert</h1>
      <p class="sub" id="description"></p>

      <label for="input" id="input-label">Input</label>
      <textarea id="input" spellcheck="false"></textarea>

      <div class="row">
        <button class="btn" id="convert" type="button">Convert</button>
        <button class="btn ghost" id="sample" type="button">Use a sample</button>
        <button class="btn ghost" id="clear" type="button">Clear</button>
      </div>

      <div id="error" class="error hidden"></div>

      <section id="text-out" class="hidden">
        <label for="output" id="output-label">Output</label>
        <textarea id="output" spellcheck="false" readonly></textarea>
        <div class="row">
          <button class="btn" id="copy-out" type="button">Copy</button>
          <a class="btn ghost" id="download" download="converted">Download</a>
        </div>
      </section>

      <section id="diagram-out" class="hidden">
        <label>Preview</label>
        <div class="preview" id="preview"></div>
        <label for="flow">The .flow source</label>
        <textarea id="flow" spellcheck="false" readonly></textarea>
        <div class="row">
          <a class="btn" id="open" href="/new">Open in the editor</a>
          <button class="btn ghost" id="copy-flow" type="button">Copy .flow</button>
        </div>
      </section>
    </main>

    <script type="module">
      import { fromCompose } from '/src/domain/compose.js'
      import { fromDrawio, toDrawio } from '/src/domain/drawio.js'
      import { fromMermaid, toMermaid } from '/src/domain/mermaid.js'
      import { fromOpenApi } from '/src/domain/openapi.js'
      import { parseFlow, serialiseFlow } from '/src/domain/flowText.js'
      import { renderSvg } from '/src/domain/renderSvg.js'
      import { encodeShare } from '/src/domain/shareLink.js'
      import { fromSql } from '/src/domain/sql.js'

      const SAMPLES = {
        mermaid: 'flowchart TD\n  A[Start] --> B{Ready?}\n  B -->|yes| C[Ship]\n  B -->|no| A',
        drawio:
          '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/><mxCell id="a" value="API" style="rounded=1;" vertex="1" parent="1"><mxGeometry x="0" y="0" width="120" height="60" as="geometry"/></mxCell></root></mxGraphModel>',
        sql: 'CREATE TABLE customers (\n  id uuid PRIMARY KEY,\n  email text\n);\nCREATE TABLE orders (\n  id bigint PRIMARY KEY,\n  customer_id uuid REFERENCES customers (id)\n);',
        compose:
          'services:\n  api:\n    image: node:22\n    depends_on: [db]\n  db:\n    image: postgres:16',
        openapi:
          "openapi: 3.1.0\ninfo: { title: Shop API }\npaths:\n  /orders:\n    get:\n      tags: [Orders]\n      responses:\n        '200': { $ref: '#/components/schemas/Order' }\ncomponents:\n  schemas:\n    Order: { properties: { id: {} } }",
      }

      const TOOLS = {
        'mermaid-to-drawio': {
          title: 'Mermaid to draw.io',
          description: 'Mermaid flowchart syntax in, draw.io XML out. Nothing is uploaded.',
          input: 'Mermaid',
          output: 'draw.io XML',
          sample: SAMPLES.mermaid,
          convert: (text) => xml(toDrawio(expect(fromMermaid(text)), 'Mermaid')),
        },
        'drawio-to-mermaid': {
          title: 'draw.io to Mermaid',
          description: 'draw.io XML in (compressed or plain, first page), Mermaid out.',
          input: 'draw.io XML',
          output: 'Mermaid',
          sample: SAMPLES.drawio,
          convert: (text) => xml(toMermaid(expect(fromDrawio(text), 'draw.io'))),
        },
        'sql-to-er': {
          title: 'SQL to ER diagram',
          description: 'CREATE TABLE statements in, an entity-relationship diagram out.',
          input: 'SQL',
          output: 'ER diagram',
          sample: SAMPLES.sql,
          convert: (text) => diagram(expect(fromSql(text), 'SQL')),
        },
        'compose-to-diagram': {
          title: 'docker-compose to diagram',
          description: 'A docker-compose.yml in, its services and dependencies out.',
          input: 'docker-compose.yml',
          output: 'diagram',
          sample: SAMPLES.compose,
          convert: (text) => diagram(expect(fromCompose(text), 'docker-compose')),
        },
        'openapi-to-diagram': {
          title: 'OpenAPI to diagram',
          description: 'An OpenAPI document in, a diagram of endpoints and schemas out.',
          input: 'OpenAPI',
          output: 'diagram',
          sample: SAMPLES.openapi,
          convert: (text) => diagram(expect(fromOpenApi(text), 'OpenAPI')),
        },
      }

      /** The read() contract: a document, or errors that stop us politely. */
      function expect(result, format) {
        if (!result.document) throw new Error(say(result.warnings, format))
        if (result.warnings.length) console.warn(say(result.warnings, format))
        return result.document
      }

      const say = (warnings, format) =>
        [`The ${format} text could not be read:`, ...warnings.map((w) => `line ${w.line}: ${w.message}`)].join('\n')

      const xml = (text) => ({ kind: 'text', text, name: 'diagram.drawio', type: 'application/xml' })

      function diagram(document) {
        const flow = serialiseFlow(document)
        return { kind: 'diagram', flow, name: 'diagram.flow', type: 'text/plain', document }
      }

      const tool = TOOLS[new URLSearchParams(location.search).get('tool') ?? ''] ?? null

      /** Named lookups, so the ids stay one source of truth. */
      const $ = (id) => document.getElementById(id)

      function show(element) {
        element.classList.remove('hidden')
      }

      function hide(element) {
        element.classList.add('hidden')
      }

      async function copy(text) {
        await navigator.clipboard.writeText(text)
      }

      if (!tool) {
        $('title').textContent = 'Converter'
        $('description').textContent =
          'Pick a converter: mermaid-to-drawio, drawio-to-mermaid, sql-to-er, compose-to-diagram or openapi-to-diagram.'
      } else {
        $('title').textContent = tool.title
        $('description').textContent = tool.description
        $('input-label').textContent = tool.input
        $('output-label').textContent = tool.output
        $('convert').addEventListener('click', run)
        $('sample').addEventListener('click', () => {
          $('input').value = tool.sample
          run()
        })
        $('clear').addEventListener('click', () => {
          $('input').value = ''
          hide($('error'))
          hide($('text-out'))
          hide($('diagram-out'))
        })
        $('input').value = tool.sample
        run()
      }

      async function run() {
        hide($('error'))
        hide($('text-out'))
        hide($('diagram-out'))
        try {
          const result = tool.convert($('input').value.trim())
          if (result.kind === 'text') {
            $('output').value = result.text
            $('download').href = URL.createObjectURL(
              new Blob([result.text], { type: result.type }),
            )
            $('download').setAttribute('download', result.name)
            $('copy-out').onclick = () => copy(result.text)
            show($('text-out'))
          } else {
            $('flow').value = result.flow
            $('preview').innerHTML = renderSvg(result.document, { theme: 'light' })
            $('open').href = '/flow#' + (await encodeShare(result.document)).slice(1)
            $('copy-flow').onclick = () => copy(result.flow)
            show($('diagram-out'))
          }
        } catch (cause) {
          $('error').textContent = cause.message
          show($('error'))
        }
      }
    </script>
  </body>
</html>
