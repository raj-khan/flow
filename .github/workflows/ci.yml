name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails if package.json and the lockfile have drifted.
      - run: npm ci

      # Each step runs even if an earlier one failed, so one run reports everything.
      - name: Lint
        if: '!cancelled()'
        run: npx eslint .

      - name: Type check
        if: '!cancelled()'
        run: npm run typecheck

      - name: Unit tests
        if: '!cancelled()'
        run: npm run test:coverage

      - name: Build
        if: '!cancelled()'
        run: npm run build

      # The examples are Flow's own diagrams: they must parse, and the SVGs next
      # to them must be what the renderer draws today.
      - name: Examples
        if: '!cancelled()'
        run: |
          npm run -s isketch -- check examples/*.flow
          for file in examples/*.flow; do npm run -s isketch -- render "$file" -o "${file%.flow}.svg"; done
          git diff --exit-code examples/

      # The Claude Code plugin ships a bundled MCP server: it must match the source.
      - name: Claude Code plugin
        if: '!cancelled()'
        run: |
          npm run -s plugin
          git diff --exit-code plugin/

      # The format docs and llms.txt are generated from templates: they must match them.
      - name: Generated docs
        if: '!cancelled()'
        run: |
          npm run -s docs
          git diff --exit-code public/

      - name: VS Code extension builds
        if: '!cancelled()'
        run: npm run -s vscode

  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        # A throwaway database reachable only from this job, so no password at all.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: isketch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # The server reads the app's domain code, and that code's dependencies.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: server

      - name: Build and test against PostgreSQL
        run: npm test
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/isketch_test

  e2e:
    name: End to end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browser binaries are far larger than node_modules.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
